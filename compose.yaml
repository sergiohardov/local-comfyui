services:
  # ComfyUI on an NVIDIA GPU, so it runs only on the machine that has one; other machines reach it over the network.
  # Shared base models live in MODELS_DIR; everything a project owns comes from its folder in PROJECT_DIR,
  # one project at a time. Without PROJECT_DIR an empty sandbox is connected instead.
  comfyui:
    build: docker/comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ${MODELS_DIR:-./data/models}:/opt/comfyui/models
      # Mounted over models/loras, so only the connected project's LoRA are visible
      - ${PROJECT_DIR:-./data/sandbox}/loras:/opt/comfyui/models/loras
      - ${PROJECT_DIR:-./data/sandbox}/input:/opt/comfyui/input
      - ${PROJECT_DIR:-./data/sandbox}/output:/opt/comfyui/output
      # UI settings belong to the machine, saved workflows to the project
      - ./data/user:/opt/comfyui/user
      - ${PROJECT_DIR:-./data/sandbox}/workflows:/opt/comfyui/user/default/workflows
      # project.yaml for the start check, and the check's cache of model hashes
      - ${PROJECT_DIR:-./data/sandbox}:/project:ro
      - ./data/cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # LoRA training of the connected project, on demand: docker compose run --rm trainer training/<name>.yaml
  # Needs nearly the whole GPU, so ComfyUI is stopped first: docker compose stop comfyui
  trainer:
    build: docker/trainer
    profiles: [train]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models:ro
      # The project is read-only except for what training writes: the LoRA and its records
      - ${PROJECT_DIR:-./data/sandbox}:/project:ro
      - ${PROJECT_DIR:-./data/sandbox}/loras:/project/loras
      - ${PROJECT_DIR:-./data/sandbox}/output:/project/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
