services:
  # ComfyUI on an NVIDIA GPU, so it runs only on the machine that has one; other machines reach it over the network:
  # the UI in a browser and the tool API (/tool/...) on the same port. Projects keep their own files and send what
  # a request needs, so all that lives here is in data/: base models, the LoRA library, outputs and job records.
  comfyui:
    build: docker/comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      # Base models and the LoRA library (models/loras) shared with the trainer
      - ${MODELS_DIR:-./data/models}:/opt/comfyui/models
      - ./data/input:/opt/comfyui/input
      - ./data/output:/opt/comfyui/output
      # UI settings and workflows saved in the UI
      - ./data/user:/opt/comfyui/user
      # Uploaded references of trainings, handed to the trainer
      - ./data/jobs:/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # LoRA training on request from the tool API (POST /tool/train), only inside the Docker network.
  # It writes into the same LoRA library ComfyUI reads; the API hands it the GPU and blocks generation meanwhile
  trainer:
    build: docker/trainer
    volumes:
      - ${MODELS_DIR:-./data/models}:/models:ro
      - ${MODELS_DIR:-./data/models}/loras:/loras
      - ./data/jobs:/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
