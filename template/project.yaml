# Project folder config for local-comfyui. Fields and rules: the tool's README, section "Проекты".
format: 1
# Latin lowercase, digits and hyphens; usually the project's repository name
name: my-project

# Base models the project needs, installed in the tool's MODELS_DIR. The container does not start
# without them or when a file's sha256 differs: another version would give other images.
models:
  - path: checkpoints/sd_xl_base_1.0.safetensors
    sha256: "31e35c80fc4829d14f90153f4c74cd59c90b779f6afe05a74cd6120b893f7e5b"

# The project's LoRA in loras/: not in git, published in the project's GitHub Releases.
# loras:
#   - file: style-v1.safetensors
#     url: https://github.com/<owner>/<repo>/releases/download/<tag>/style-v1.safetensors
#     sha256: "<64 hex characters>"
loras: []
