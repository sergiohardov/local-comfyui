# Prompt list for a batch run: docker compose exec comfyui python /opt/tool/run.py prompts/example.yaml
# Images go to output/example/<name>-s<seed>_00001_.png. Liked one? Put its seed here to repeat it.

# Settings for every item; an item can override any of them
checkpoint: sd_xl_base_1.0.safetensors
width: 1024
height: 1024
steps: 28
cfg: 6
sampler: dpmpp_2m
scheduler: karras
negative: "photo, realistic, 3d render, blurry, text, watermark"

items:
  - name: red-apple
    prompt: "a red apple on a wooden table, simple background"
    count: 2
    seed: 1000
  - name: forest-road
    prompt: "a road through a forest at sunset, wide view"
    width: 1344
    height: 768
